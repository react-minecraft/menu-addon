title: "&8{player.name} analysis"
size: 54

listing:

  allowed-slots:

    - 10-16
    - 19-25
    - 28-34
    - 37-43

entry-template:

  failures:

    per-entry: 11

    decimal-format: '0.00000'

    format: " {probability:colored} &7| &8{check.name} &7| &#f0f0f0{passed-time:formatted}"

  material:

    colored-pane:

      enabled: true

      color: probability

    otherwise: white_stained_glass_pane

  name: " <color:#14b8a6>[⚡] <color:#f0f0f0>Average probability: {statistic.average-probability:colored}  "

  lore:

    header:
      - ' '
      - ' <color:#f0f0f0>Prob.    &7| <color:#f0f0f0>Check    &7| <color:#f0f0f0>Elapsed'
      - ' &7&m                                 '

    footer:
      - ' '

  update-on-failure-receive: true

  on-left-click: [ ]

  on-right-click: [ ]

items:

  next:

    material: tipped_arrow

    color: '#14b8a6'

    slots:

      - 51

    name: " <color:#f0f0f0>Next page <color:#14b8a6>[→]  "

    on-left-click:

      - "[sound] ui.button.click;1.0;1.0"
      - "[switch-to-page] {pagination:next}"

  previous:

    material: tipped_arrow

    color: '#14b8a6'

    slots:

      - 47

    name: " <color:#14b8a6>[←] <color:#f0f0f0>Previous page  "

    on-left-click:

      - "[sound] ui.button.click;1.0;1.0"
      - "[switch-to-page] {pagination:previous}"

  back:

    material: barrier

    slots:

      - 49

    name: " <color:#14b8a6>[←] <color:#f0f0f0>Back to flagged players  "

    on-left-click:

      - "[sound] ui.button.click;1.0;1.0"
      - "[open-target-selector]"

  filler:

    material: cyan_stained_glass_pane

    name: '&r'

    lore: [ ]

    # noinspection YAMLIncompatibleTypes
    slots:

      - 0-8

      - 45-46
      - 48
      - 50
      - 52-53

# Do not change the configuration version.
config-version: 1
