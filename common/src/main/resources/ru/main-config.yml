settings:

  # Изменение литерала команды или права требует перезагрузки аддона через /react reboot addons.
  argument-literal: menu

  permission: react.menu.view

  # Показывать в меню онлайн-игроков без результатов анализа.
  include-empty-history: false

  format:

    probability: '0.00000'

    elapsed-time:

      now: 'только что'
      never: 'никогда'
      separator: ' '
      max-parts: 2

      days: '{value}д'
      hours: '{value}ч'
      minutes: '{value}м'
      seconds: '{value}с'

open:

  on-console:
    - "[msg] <b><gradient:#14B8A6:#2DD4BF>⚡ ʀᴇᴀᴄᴛ-ᴍᴇɴᴜ</gradient></b> <gray>»</gray> <white>Эта команда доступна только игрокам."
    - "[sound] block.note_block.bass;1.0;0.8"

  on-denied:
    - "[msg] <b><gradient:#14B8A6:#2DD4BF>⚡ ʀᴇᴀᴄᴛ-ᴍᴇɴᴜ</gradient></b> <gray>»</gray> <white>У вас нет права <red>{permission}</red>."
    - "[sound] block.note_block.bass;1.0;0.8"

reload:

  on-start:
    - "[msg] <b><gradient:#14B8A6:#2DD4BF>⚡ ʀᴇᴀᴄᴛ-ᴍᴇɴᴜ</gradient></b> <gray>»</gray> <white>Начата перезагрузка аддона..."
    - "[bar] <b><gradient:#14B8A6:#2DD4BF>⚡ ʀᴇᴀᴄᴛ-ᴍᴇɴᴜ</gradient></b> <gray>»</gray> <white>Начата перезагрузка..."
    - "[sound] block.note_block.pling;1.0;1.0"

  on-finish:
    - "[msg] <b><gradient:#14B8A6:#2DD4BF>⚡ ʀᴇᴀᴄᴛ-ᴍᴇɴᴜ</gradient></b> <gray>»</gray> <white>Аддон перезагружен!"
    - "[bar] <b><gradient:#14B8A6:#2DD4BF>⚡ ʀᴇᴀᴄᴛ-ᴍᴇɴᴜ</gradient></b> <gray>»</gray> <white>Аддон успешно перезагружен!"
    - "[sound] entity.player.levelup;1.0;1.0"

  on-failure:
    - "[msg] <b><gradient:#14B8A6:#2DD4BF>⚡ ʀᴇᴀᴄᴛ-ᴍᴇɴᴜ</gradient></b> <gray>»</gray> <white>Не удалось перезагрузить аддон. Подробности в консоли."
    - "[sound] block.note_block.bass;1.0;0.8"

# Не меняйте версию конфигурации.
config-version: 1
