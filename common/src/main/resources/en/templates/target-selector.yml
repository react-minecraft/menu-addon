title: "&8Flagged players"
size: 54

listing:

  sort:

    by: latest-failure
    descending: true

  allowed-slots:

    - 10-16
    - 19-25
    - 28-34
    - 37-43

target-template:

  material:

    use-player-head: true

    otherwise: player_head

  name: " <color:#14b8a6>[⚡] <color:#f0f0f0>{player.name}  "

  failures:

    max: 15

    per-line: 5

    appending: left

    decimal-format: '0.00000'

    format: '{probability:colored}'

    separator: ' '

    empty: '&7No data'

  lore:
    - ""
    - " <color:#f0f0f0>Latest checks:  "
    - " {target.failures:formatted}  "
    - ""
    - " <color:#f0f0f0>Average probability:  "
    - " {target.statistic.average-probability:colored}  "
    - ""
    - " <color:#f0f0f0>Last analysis:  "
    - " <color:#14b8a6>{target.last-analysis:formatted}  "
    - ""
    - " <color:#14b8a6>▶ <color:#f0f0f0>Left-click to spectate  "
    - " <color:#14b8a6>▶ <color:#f0f0f0>Right-click to view analysis  "
    - " "

  update-on-failure-receive: true

  on-left-click:

    - "[sound] ui.button.click;1.0;1.0"
    - "[gm] 3"
    - "[tp-to-target]"

  on-right-click:

    - "[sound] ui.button.click;1.0;1.0"
    - "[select-clicked]"

items:

  next:

    material: tipped_arrow

    color: '#14b8a6'

    slots:

      - 51

    name: " <color:#f0f0f0>Next page <color:#14b8a6>[→]  "

    on-left-click:

      - "[sound] ui.button.click;1.0;1.0"
      - "[switch-to-page] {pagination:next}"

  previous:

    material: tipped_arrow

    color: '#14b8a6'

    slots:

      - 47

    name: " <color:#14b8a6>[←] <color:#f0f0f0>Previous page  "

    on-left-click:

      - "[sound] ui.button.click;1.0;1.0"
      - "[switch-to-page] {pagination:previous}"


  filler0:

    material: cyan_stained_glass_pane

    name: '&r'

    lore: [ ]

    # noinspection YAMLIncompatibleTypes
    slots:

      - 9
      - 17-18
      - 26-27
      - 35-36
      - 44

  filler:

    material: gray_stained_glass_pane

    name: '&r'

    lore: [ ]

    slots:

      - 0-8

      - 45-46
      - 48-50
      - 52-53

# Do not change the configuration version.
config-version: 1
